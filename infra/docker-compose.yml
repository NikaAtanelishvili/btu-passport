# IN-01. Dev: only the infrastructure runs here; api, worker, signer and web run on the
# host with hot reload (make api / web / ...). The containerised production stack is
# infra/docker-compose.prod.yml (M10).
#
# Started via the Makefile, which passes --env-file .env from the repo root.
# Images are pinned to exact tags (and digests where the tag is mutable).

name: btu-passport

services:
  db:
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: passport
      POSTGRES_PASSWORD: passport # DEV ONLY
      POSTGRES_DB: passport
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro # creates passport_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passport -d passport"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio:
    # MinIO stopped publishing official images in Oct 2025 (project archived 2026);
    # Chainguard's free rebuild from source is used instead, pinned by digest.
    # See Deviations in docs/plan/00-overview.md.
    image: cgr.dev/chainguard/minio@sha256:ae73835075ee168f1745cc28d4cf5bbd6a5973e5609b2b2593280aaa495ea113
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      # The image has bash but no curl or grep: plain HTTP over /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:8548a9731c3f4cf507d8596c18c351ddb8fcb1063f212e6dd72ff5eeb697bc9c
    depends_on:
      minio: { condition: service_healthy }
    environment:
      # mc reads the alias from MC_HOST_<alias>; the image has no shell.
      MC_HOST_local: http://${S3_ACCESS_KEY:-minio}:${S3_SECRET_KEY:-minio-secret}@minio:9000
    # Buckets are private unless a policy is set; none is set.
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-passports}"]
    restart: "no"
    networks: [backend]

  mailpit:
    # Dev only: catches every email the API sends (IN-04). SMTP 1025, inbox UI + REST API 8025.
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.6@sha256:4a16a86f41d30418fbdca47ce2868121bbb0aeaa0a34bde2dd1e2911c4be2464
    # The image's entrypoint is `/bin/sh -c`, so the command is one string; `exec` makes
    # anvil PID 1 so it gets SIGTERM and writes --state on shutdown.
    command: ["exec anvil --host 0.0.0.0 --chain-id 31337 --state /data/anvil-state.json"]
    user: root # named volume is root-owned; dev-only chain
    ports: ["8545:8545"]
    volumes:
      - anvildata:/data
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, signing]

networks:
  backend:
    # Pinned to a private range (the prod stack pins its own, 172.29.0.0/24).
    ipam:
      config:
        - subnet: 172.28.0.0/24
  signing: {}

volumes:
  pgdata: {}
  miniodata: {}
  anvildata: {}
