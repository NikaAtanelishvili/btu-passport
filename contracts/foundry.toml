# BC-01. Foundry project for the PassportRegistry contract.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.38"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../shared" },
]

[fmt]
line_length = 100

# BC-08: `make chain-deploy-sepolia` passes --rpc-url demo, so the provider URL (it holds an
# API key) comes from the environment instead of the command line.
[rpc_endpoints]
demo = "${DEMO_RPC_URL}"
