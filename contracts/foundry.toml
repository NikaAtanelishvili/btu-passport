# BC-01. Foundry project for the PassportRegistry contract.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.38"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../shared" },
]

[fmt]
line_length = 100
